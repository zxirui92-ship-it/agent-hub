[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-foundation"
version = "0.1.0"
description = "Candidate contracts and deterministic orchestration foundation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["common*", "hub_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_cache/tmp"
