[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-foundation"
version = "0.1.0"
description = "Candidate contracts and deterministic orchestration foundation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5", "python-dotenv>=1,<2", "langgraph==1.2.15"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["common*", "hub_platform*", "agents*", "web*"]

[tool.setuptools.package-data]
"agents.router.skills" = ["knowledge_sample.json"]
"common" = ["fixtures/*.json", "fixtures/m3/*.json"]
"web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_cache/tmp"
markers = ["live: explicit opt-in external API tests; may incur charges", "planner_live: real top-level planner model behavior", "business_live: real business model and end-to-end tests"]
